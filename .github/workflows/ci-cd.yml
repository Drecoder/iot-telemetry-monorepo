name: Cloud Telemetry Monorepo Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  INIT_ARCH: amd64

jobs:
  # ==========================================
  # JOB 1: STATIC APPLICATION SECURITY TESTING (SAST)
  # ==========================================
  static-analysis:
    name: Lint & IaC Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for Infrastructure or Configuration Changes
        id: changed-files
        run: |
          git fetch origin main --depth=1
          if git diff --name-only origin/main...HEAD | grep -E '^(terraform/|.*/Dockerfile|\.github/workflows/)'; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Checkov IaC Scanner
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: bridgecrewio/checkov-action@v12.2987.0
        with:
          directory: .
          framework: terraform,dockerfile
          output_format: sarif
          output_file_path: results.sarif
        continue-on-error: true

      - name: Upload Checkov Security Scan Results
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'results.sarif'

      - name: Run Hadolint Dockerfile Linter
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

  # ==========================================
  # JOB 2: WORKSPACE COMPILATION, TESTING & DETERMINISTIC AI VALIDATION
  # ==========================================
  workspace-lifecycle:
    name: Test, Validate & Lint Workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for Application Source Changes
        id: changed-files
        run: |
          git fetch origin main --depth=1
          if git diff --name-only origin/main...HEAD | grep -E '\.(js|ts|json|txt)$|^package-lock\.json$|^Makefile$'; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js Environment
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JavaScript CI Tooling
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm install -g ajv-cli

      - name: Run NPM Manifest Audit
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm audit --audit-level=critical

      # --- DETERMINISTIC AI QUALITY CHECKS ---
      - name: Scan Codebase for Hallucinations & Leaked Data
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Scanning for unresolved hallucinated dependencies or placeholder tokens..."
          grep -r "nonexistent_dependency_placeholder" --include="*.js" --include="*.ts" && exit 1 || true
          
          echo "Scanning for incomplete generation stubs..."
          grep -rn "TODO: AI_GENERATED" --include="*.js" --include="*.ts" && exit 1 || true

      - name: Execute Deterministic Schema Validation
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ -f "schema.json" ] && [ -f "output.json" ]; then
            ajv validate -s schema.json -d output.json
          else
            echo "Skipping schema assertion: schema.json or output.json missing."
          fi

      - name: Evaluate Text Drift and Target Baseline Regressions
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ -f "baseline.txt" ] && [ -f "output.txt" ]; then
            diff baseline.txt output.txt
          else
            echo "Skipping baseline check: Required regression artifacts missing."
          fi

      # --- CORE EXECUTION & LOCAL RUNTIME LINTING ---
      - name: Setup Terraform CLI
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0

      - name: Run Complete Test Suite Pipeline
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          make install
          make test
        env:
          AWS_ACCESS_KEY_ID: mock-key-id
          AWS_SECRET_ACCESS_KEY: mock-secret-key
          AWS_DEFAULT_REGION: us-east-1

      - name: Run ESLint (JS Static Linter via Local Context)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npx eslint . --quiet

  # ==========================================
  # JOB 3: CONTAINER INTROSPECTION (VULNERABILITY SCAN)
  # ==========================================
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for Application Code or Container Definition Changes
        id: changed-files
        run: |
          git fetch origin main --depth=1
          if git diff --name-only origin/main...HEAD | grep -E '^apps/telemetry-api/|.*/Dockerfile|^package-lock\.json$'; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Local Image for Introspection
        if: steps.changed-files.outputs.any_changed == 'true'
        run: docker build -f apps/telemetry-api/Dockerfile -t local/cloud-telemetry-app:latest .

      - name: Create Scan Results Directory
        if: steps.changed-files.outputs.any_changed == 'true'
        run: mkdir -p scan-results

      - name: Run Trivy Container Introspection
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'local/cloud-telemetry-app:latest'
          format: 'sarif'
          output: 'scan-results/trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Container Scan Results
        if: always() && steps.changed-files.outputs.any_changed == 'true' && hashFiles('scan-results/trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'scan-results/trivy-results.sarif'