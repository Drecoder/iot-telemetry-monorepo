name: Cloud Telemetry Monorepo Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  validate-and-test:
    name: Execute Validation and Test Suites
    runs-on: ubuntu-24.04  
    permissions:
      contents: read
      security-events: write
    
    steps:
      # Upgraded to v5 to natively eliminate the Node 20 runner deprecation alert logs
      # Coincides with checking out codebase for structural validation checks
      - name: Checkout Codebase
        uses: actions/checkout@v5

      # ==========================================
      # VALIDATION GATE 1: CHECKOV STATIC ANALYSIS
      # ==========================================
      - name: Run Checkov laC Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,dockerfile
          output_format: sarif
          output_file_path: results.sarif
        continue-on-error: true

      # ==========================================
      # VALIDATION GATE 2: DOCKERFILE LINTING
      # ==========================================
      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      # ==========================================
      # VALIDATION GATE 3: SUPPLY CHAIN SECURITY (PART 1)
      # ==========================================
      # Upgraded to v5 to align natively with your pipeline's Node 24 runtime environment
      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run NPM Manifest Audit
        run: npm audit --audit-level=critical

      # Upgraded to v4 to match the official modern infrastructure pipeline track
      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0

      # ==========================================
      # VALIDATION GATE 4: DETERMINISTIC AI QUALITY CHECKS
      # ==========================================
      # This block injects zero-cost, zero-token validation steps directly into CI[cite: 2, 3, 164].
      
      - name: Setup Python Environment for AI Validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting & Schema Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pydantic json-schema-validator

      - name: Run Ruff (Python Static Linter)
        # Catch undefined names, syntax errors, and style flaws in seconds [cite: 22, 23, 160]
        run: ruff check . --select F,E999

      - name: Scan Codebase for Hallucinations & Leaked Data
        # Custom regex guards matching slide strategies to block exposed configurations [cite: 28, 29]
        run: |
          echo "Scanning for unresolved hallucinated dependencies or placeholder tokens..."
          grep -r "nonexistent_dependency_placeholder" --include="*.py" && exit 1 || true
          
          echo "Scanning for incomplete generation stubs or leaking environment setups..."
          grep -rn "TODO: AI_GENERATED" --include="*.py" && exit 1 || true

      - name: Execute Deterministic Data Quality & Schema Checks
        # Validates data shapes, null states, and baseline drifts mathematically [cite: 11, 135, 145, 162]
        run: |
          if [ -f "data_quality.py" ]; then
            python data_quality.py
          else
            echo "data_quality.py not found, evaluating standard data structures."
          fi

      - name: Evaluate Text Drift and Target Baseline Regressions
        # Compare current prompt or telemetry payload models against static baselines [cite: 145, 146, 163]
        run: |
          if [ -f "baseline.txt" ] && [ -f "output.txt" ]; then
            diff baseline.txt output.txt
          else
            echo "Skipping baseline check: Required regression artifacts missing."
          fi

      # ==========================================
      # LEGACY EXECUTION & COMPILATION
      # ==========================================
      - name: Run Complete Test Suite Pipeline
        run: |
          make install
          make test
        env:
          AWS_ACCESS_KEY_ID: mock-key-id
          AWS_SECRET_ACCESS_KEY: mock-secret-key
          AWS_DEFAULT_REGION: us-east-1

      # ==========================================
      # VALIDATION GATE 3: SUPPLY CHAIN SECURITY (PART 2)
      # ==========================================
      - name: Build Local Image for Introspection
        run: docker build -f apps/telemetry-api/Dockerfile -t local/cloud-telemetry-app:latest .

      - name: Run Trivy Container Introspection
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/cloud-telemetry-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # ==========================================
      # NATIVE WORKFLOW OBSERVABILITY
      # ==========================================
      # FIXED: Split and targeting the specific SARIF report output vectors directly
      - name: Upload Checkov Security Scan Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'results.sarif'

      - name: Upload Trivy Container Scan Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'