name: Cloud Telemetry Monorepo Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Execute Validation and Test Suites
    runs-on: ubuntu-24.04  # FIX: Use Node.js 24 runner
    permissions:
      contents: read
      security-events: write
    
    steps:
      # FIX: Force Node.js 24 for all JavaScript actions
      - name: Force Node.js 24 for GitHub Actions
        run: echo "ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=false" >> $GITHUB_ENV

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Checkov laC Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,dockerfile
          output_format: sarif
          output_file_path: results.sarif
        continue-on-error: true

      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run NPM Manifest Audit
        run: npm audit --audit-level=critical

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Run Complete Test Suite Pipeline
        run: |
          make install
          make test
        env:
          AWS_ACCESS_KEY_ID: mock-key-id
          AWS_SECRET_ACCESS_KEY: mock-secret-key
          AWS_DEFAULT_REGION: us-east-1

      - name: Build Local Image for Introspection
        run: docker build -t local/cloud-telemetry-app:latest .

      - name: Run Trivy Container Introspection
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/cloud-telemetry-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # FIX: Upgrade CodeQL from v3 to v4
      - name: Upload Security Results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4  # ← Changed from v3
        if: always()
        with:
          sarif_file: '.'