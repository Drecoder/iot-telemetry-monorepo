name: Cloud Telemetry Monorepo Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  INIT_ARCH: amd64

jobs:
  validate-and-test:
    name: Execute Validation and Test Suites
    runs-on: ubuntu-24.04  
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      # ==========================================
      # VALIDATION GATE 1: CHECKOV STATIC ANALYSIS
      # ==========================================
      - name: Run Checkov laC Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,dockerfile
          output_format: sarif
          output_file_path: results.sarif
        continue-on-error: true

      # ==========================================
      # VALIDATION GATE 2: DOCKERFILE LINTING
      # ==========================================
      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      # ==========================================
      # VALIDATION GATE 3: SUPPLY CHAIN SECURITY (PART 1)
      # ==========================================
      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JavaScript CI Tooling
        run: npm install -g ajv-cli eslint

      - name: Run ESLint (JS Static Linter)
        # FIXED: Removed the hacky fallback pipe. ESLint now acts as a strict gate 
        # reading natively from your eslint.config.js workspace file.
        run: npx eslint . --quiet

      - name: Run NPM Manifest Audit
        run: npm audit --audit-level=critical

      # ==========================================
      # VALIDATION GATE 4: DETERMINISTIC AI QUALITY CHECKS (NODE/SHELL)
      # ==========================================
      - name: Scan Codebase for Hallucinations & Leaked Data
        run: |
          echo "Scanning for unresolved hallucinated dependencies or placeholder tokens..."
          grep -r "nonexistent_dependency_placeholder" --include="*.js" --include="*.ts" && exit 1 || true
          
          echo "Scanning for incomplete generation stubs or leaking environment setups..."
          grep -rn "TODO: AI_GENERATED" --include="*.js" --include="*.ts" && exit 1 || true

      - name: Execute Deterministic Schema Validation
        run: |
          if [ -f "schema.json" ] && [ -f "output.json" ]; then
            ajv validate -s schema.json -d output.json
          else
            echo "Skipping schema assertion: schema.json or output.json missing."
          fi

      - name: Evaluate Text Drift and Target Baseline Regressions
        run: |
          if [ -f "baseline.txt" ] && [ -f "output.txt" ]; then
            diff baseline.txt output.txt
          else
            echo "Skipping baseline check: Required regression artifacts missing."
          fi

      # ==========================================
      # SETUP TERRAFORM
      # ==========================================
      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0

      # ==========================================
      # LEGACY EXECUTION & COMPILATION
      # ==========================================
      - name: Run Complete Test Suite Pipeline
        run: |
          make install
          make test
        env:
          AWS_ACCESS_KEY_ID: mock-key-id
          AWS_SECRET_ACCESS_KEY: mock-secret-key
          AWS_DEFAULT_REGION: us-east-1

      # ==========================================
      # VALIDATION GATE 3: SUPPLY CHAIN SECURITY (PART 2)
      # ==========================================
      - name: Build Local Image for Introspection
        run: docker build -f apps/telemetry-api/Dockerfile -t local/cloud-telemetry-app:latest .

      - name: Create Scan Results Directory
        run: mkdir -p scan-results

      - name: Run Trivy Container Introspection
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local/cloud-telemetry-app:latest'
          format: 'sarif'
          output: 'scan-results/trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # ==========================================
      # NATIVE WORKFLOW OBSERVABILITY
      # ==========================================
      - name: Upload Checkov Security Scan Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'results.sarif'

      - name: Upload Trivy Container Scan Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'scan-results/trivy-results.sarif'